name: baca-halaman

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "daftar (semua halaman daftar sumber.json) | daftar-url | artikel"
        required: true
        default: "daftar"
      urls:
        description: "URL dipisah spasi (untuk mode daftar-url / artikel), maks 20 per run"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: baca-halaman
  cancel-in-progress: false

jobs:
  baca:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Baca
        env:
          MODE: ${{ inputs.mode }}
          URLS: ${{ inputs.urls }}
        run: python scripts/baca_halaman.py "$MODE" $URLS
      - name: Simpan hasil
        run: |
          git config user.name "jatimverse-bot"
          git config user.email "bot@jatimverse.id"
          git add -f bacaan/hasil.md
          if git diff --cached --quiet; then echo "tidak ada perubahan"; exit 0; fi
          git commit -m "baca halaman otomatis"
          for i in 1 2 3; do
            # -X theirs: saat rebase, versi bot yang menang di bagian yang bentrok
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          echo "gagal menyimpan hasil setelah 3 percobaan"; exit 1
