name: pipeline-harian

on:
  schedule:
    # 2x sehari untuk hemat menit Actions (sebelumnya 5x). Unggah idempoten, jadi jadwal
    # siang ikut menjadi cadangan jika jadwal pagi terlewat atau gagal.
    - cron: "0 1 * * *"    # 08.00 WIB (01.00 UTC)
    - cron: "0 7 * * *"    # 14.00 WIB
  workflow_dispatch:
    inputs:
      mode:
        description: "kering = hanya rencana, nyata = unggah (tetap butuh aktif=true di config)"
        type: choice
        options: [kering, nyata]
        default: nyata
      maks:
        description: "Maksimal paket per jalan (kosong = ikuti config)"
        required: false
        default: ""
      sinkron_semua:
        description: "Cek ulang metadata semua post (lambat, biasanya tidak perlu)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pipeline-harian
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow requests
      - name: Proses foto
        run: python scripts/proses_foto.py
      - name: Verifikasi
        run: python scripts/verifikasi.py --tulis
      - name: Unggah WordPress
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          MODE: ${{ inputs.mode }}
          MAKS: ${{ inputs.maks }}
          SINKRON_SEMUA: ${{ inputs.sinkron_semua }}
        run: |
          ARGS=""
          [ "$MODE" = "kering" ] && ARGS="$ARGS --kering"
          [ -n "$MAKS" ] && ARGS="$ARGS --maks $MAKS"
          [ "$SINKRON_SEMUA" = "true" ] && ARGS="$ARGS --sinkron-semua"
          python scripts/upload_wp.py $ARGS
      - name: Simpan hasil
        if: always()
        run: |
          git config user.name "jatimverse-bot"
          git config user.email "bot@jatimverse.id"
          git add -A
          if git diff --cached --quiet; then echo "tidak ada perubahan"; exit 0; fi
          git commit -m "pipeline harian otomatis"
          for i in 1 2 3; do
            # -X theirs: saat rebase, versi bot yang menang di bagian yang bentrok
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          echo "gagal menyimpan hasil setelah 3 percobaan"; exit 1
